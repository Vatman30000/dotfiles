# ~/.config/kitty/ascii.conf
shell /home/alexandr/bin/ascii-wall
font_family       JetBrainsMono Nerd Font
font_size         7.0
modify_font       cell_height -2.5
background_opacity 0.75
remember_window_size no
initial_window_width  80c
cursor_shape block
cursor_blink_interval 0
hide_window_decorations yes   # по желанию
##### ЦВЕТА — Catppuccin Macchiato #####
# Основные
foreground            #cad3f5
background            #24273a
cursor                #f4dbd6
cursor_text_color     #24273a
selection_foreground  #24273a
selection_background  #f4dbd6

cursor_trail 180
curtor_shape beam
cursor_trail_decay 0.05 0.28
cursor_trail_start_threshold 2
cursor_trail_color none
##### ЦВЕТА — Catppuccin Macchiato #####
# Основные
foreground            #cad3f5
background            #24273a
cursor                #f4dbd6
cursor_text_color     #24273a
selection_foreground  #24273a
selection_background  #f4dbd6

# Поисковые совпадения (аналог search)
# В Kitty нет отдельного блока, но можно приблизить через mark/selection/hints,
# здесь оставим базовый набор цветов из твоей схемы:

# Нормальные цвета
color0  #494d64
color1  #ed8796
